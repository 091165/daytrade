name: Collect Minute Bars

on:
  schedule:
    # 平日の引け後（JST 15:47 / 17:47 = UTC 6:47 / 8:47）。遅れや失敗があっても1分足は7日分さかのぼって取れる
    - cron: "47 6 * * 1-5"
    - cron: "47 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_minutes.py

      - name: Collect minute bars
        run: python src/collect_minutes.py

      - name: Commit minute bars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/minutes/
          if ! git diff --quiet --cached; then
            git commit -m "chore: save minute bars"
            git pull --rebase -X ours origin main || git rebase --abort
            git push
          fi
