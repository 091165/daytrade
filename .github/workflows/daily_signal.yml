name: Daily Kiriban Signal

on:
  schedule:
    # 平日の寄り前に3回（JST 6:37 / 7:07 / 7:37 = UTC 前日 21:37 / 22:07 / 22:37）
    # 定期実行は混雑で大きく遅れる（2026/9〜10月の実績: 7:30指定で遅れの中央値 約2時間15分、寄り前0回）。
    # 混雑しやすい 00分・30分ちょうどを避け、米国市場の引け（冬時間 6:00 JST）後に複数回入れる。
    # 9:00以降に遅れて動いた分は、今日の寄り前の版があれば上書きしない（src/run_timing.py）。
    - cron: "37 21 * * 0-4"
    - cron: "7 22 * * 0-4"
    - cron: "37 22 * * 0-4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python tests/test_kiriban.py
          python tests/test_sector_mapping.py
          python tests/test_market_direction.py
          python tests/test_warnings_module.py
          python tests/test_market_context.py
          python tests/test_history.py
          python tests/test_stock_picks.py
          python tests/test_trading_rules.py
          python tests/test_stock_trend.py
          python tests/test_card_notes.py
          python tests/test_trade_plan.py
          python tests/test_stock_page.py
          python tests/test_us_range_study.py
          python tests/test_focus_stocks.py
          python tests/test_focus_backtest.py
          python tests/test_expected_range.py
          python tests/test_run_timing.py
          python tests/test_archive.py
          python tests/test_morning_range.py
          python tests/test_round_study.py

      - name: Generate signal dashboard
        run: python src/main.py

      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --quiet --cached; then
            git commit -m "chore: update signal dashboard"
            # コンフリクト時はローカル(今生成したファイル)を優先する
            git pull --rebase -X ours origin main || git rebase --abort
            git push
          fi

  deploy-pages:
    needs: generate-signal
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - id: deployment
        uses: actions/deploy-pages@v4
