name: Level study (temporary)
on:
  push:
    branches: [ccr-19d039d6-uxmzc4]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: cd src && python -c "from level_study import run_level_study; r = run_level_study(); [print(c, [(k['kind'], k['n'], round(k['bounce'] or 0, 2)) for k in v['kinds']], v.get('control_bounce')) for c, v in r['per_code'].items()]"
