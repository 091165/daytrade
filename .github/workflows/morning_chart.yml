name: Morning Chart

on:
  schedule:
    # 平日の引け後（JST 15:53 = UTC 6:53）。寄り〜10:30 の分足チャートを描き直す
    - cron: "53 6 * * 1-5"
  workflow_dispatch:
    inputs:
      codes:
        description: "銘柄コード（空白区切り）"
        required: false
        default: "5803 9984 6981"
      days:
        description: "営業日数（1分足は直近30日分まで）"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Japanese font
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python tests/test_morning_chart.py

      - name: Draw charts
        run: |
          for c in ${{ github.event.inputs.codes || '5803 9984 6981' }}; do
            python src/morning_chart.py "$c" --days "${{ github.event.inputs.days || '20' }}"
          done

      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/charts/
          if ! git diff --quiet --cached; then
            git commit -m "chore: update morning chart"
            git pull --rebase -X ours origin main || git rebase --abort
            git push
          fi
