name: US range study (temporary)
on:
  push:
    branches: [ccr-19d039d6-uxmzc4]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: cd src && python -c "from us_range_study import run_us_range_study; run_us_range_study('2y'); print('--- 5y'); run_us_range_study('5y')"
